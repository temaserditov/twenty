name: serditov-crm-local

x-twenty-env: &twenty-env
  NODE_PORT: 3000
  SERVER_URL: http://localhost:3033
  PG_DATABASE_URL: postgres://crm:${CRM_PG_PASSWORD:?required}@db:5432/crm
  REDIS_URL: redis://redis:6379
  ENCRYPTION_KEY: ${CRM_ENCRYPTION_KEY:?required}
  STORAGE_TYPE: local
  EMAIL_DRIVER: logger
  TELEMETRY_ENABLED: 'false'

services:
  server:
    image: twentycrm/twenty:v2.47.0@sha256:9ad70398e4a3577ae3060fa3fcfbf160f130e056218b6a30adb65cf057bcc5b1
    ports: ['127.0.0.1:3033:3000']
    environment: *twenty-env
    volumes: ['files:/app/packages/twenty-server/.local-storage']
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:3000/healthz']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped
  worker:
    image: twentycrm/twenty:v2.47.0@sha256:9ad70398e4a3577ae3060fa3fcfbf160f130e056218b6a30adb65cf057bcc5b1
    command: ['yarn', 'worker:prod']
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
    volumes: ['files:/app/packages/twenty-server/.local-storage']
    depends_on:
      server: {condition: service_healthy}
    restart: unless-stopped
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${CRM_PG_PASSWORD:?required}
    volumes: ['database:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4.6-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  database:
  files:
  redis:
